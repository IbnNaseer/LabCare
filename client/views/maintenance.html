<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Logs — LabCare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div id="app-layout">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
          <h1 class="page-title">Maintenance & Service Logs</h1>
        </div>
        <div class="topbar-right">
          <button type="button" id="open-log-modal-btn" class="btn-primary-custom" style="padding: 7px 14px; font-size: 13px;">
            <i class="bi bi-plus-lg"></i>
            <span>Log Repair Action</span>
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content-area">
        <!-- Maintenance Logs Table -->
        <div class="card-custom" style="padding: 0; overflow: hidden;">
          <div style="padding: 16px 20px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center;">
            <h2 class="card-title" style="margin: 0;">Completed Repair & Service History <span id="log-count" style="font-size: 13px; font-weight: 500; color: var(--color-neutral);"></span></h2>
          </div>

          <div style="overflow-x: auto;">
            <table class="table-custom">
              <thead>
                <tr>
                  <th>Equipment Asset</th>
                  <th>Service Date</th>
                  <th>Technician</th>
                  <th>Action Taken</th>
                  <th>Parts Used</th>
                  <th>Cost</th>
                </tr>
              </thead>
              <tbody id="maintenance-table-body">
                <!-- Populated dynamically via maintenance.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Log Maintenance Modal -->
  <div id="log-maintenance-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: white; border-radius: 12px; padding: 24px; max-width: 520px; width: 90%; box-shadow: var(--shadow-lg);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px; font-weight: 700; color: var(--color-text-dark); margin: 0;">Log Maintenance Action</h2>
        <button type="button" id="close-log-modal-btn" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-neutral);">&times;</button>
      </div>

      <form id="maintenance-form">
        <div style="margin-bottom: 14px;">
          <label class="form-label-custom" for="maint-equipment">Equipment Asset <span style="color: var(--color-danger);">*</span></label>
          <select id="maint-equipment" class="form-select-custom" required>
            <option value="">Loading equipment...</option>
          </select>
        </div>

        <div style="margin-bottom: 14px;">
          <label class="form-label-custom" for="maint-fault-report">Link to Fault Report (Optional)</label>
          <select id="maint-fault-report" class="form-select-custom">
            <option value="">-- Routine Maintenance --</option>
          </select>
        </div>

        <div style="margin-bottom: 14px;">
          <label class="form-label-custom" for="maint-action">Action Taken / Repairs Performed <span style="color: var(--color-danger);">*</span></label>
          <textarea id="maint-action" class="form-control-custom" rows="3" placeholder="Describe the diagnostic steps, repairs, calibration, or adjustments made..." required></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; margin-bottom: 16px;">
          <div>
            <label class="form-label-custom" for="maint-parts">Parts / Consumables Used</label>
            <input type="text" id="maint-parts" class="form-control-custom" placeholder="e.g. 100W Halogen Lamp, Fuse 5A">
          </div>
          <div>
            <label class="form-label-custom" for="maint-cost">Cost (₦)</label>
            <input type="number" id="maint-cost" class="form-control-custom" placeholder="0.00" min="0" step="0.01" value="0">
          </div>
        </div>

        <div style="margin-bottom: 20px; background-color: var(--color-surface); padding: 12px; border-radius: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">
            <input type="checkbox" id="maint-resolve-check" checked style="accent-color: var(--color-success);">
            <span>Mark linked fault report as <strong>Resolved</strong></span>
          </label>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn-outline-custom" onclick="document.getElementById('log-maintenance-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn-primary-custom">Save Maintenance Log</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/maintenance.js"></script>
  <script>
    if (auth.requireAuth(['Technologist', 'Engineer', 'Admin'])) {
      renderSidebar('maintenance');
      loadMaintenance();
    }
  </script>
</body>
</html>
