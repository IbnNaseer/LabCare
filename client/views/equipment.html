<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Inventory — LabCare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div id="app-layout">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
          <h1 class="page-title">Equipment Inventory</h1>
        </div>
        <div class="topbar-right">
          <button type="button" id="open-add-modal-btn" class="btn-primary-custom admin-only-btn" style="padding: 7px 14px; font-size: 13px;">
            <i class="bi bi-plus-lg"></i>
            <span>Add Equipment</span>
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content-area">
        <!-- Search & Filter Controls -->
        <div class="card-custom" style="padding: 16px 20px; margin-bottom: 20px;">
          <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 240px; position: relative;">
              <input type="text" id="equipment-search" class="form-control-custom" placeholder="Search by name, serial number, location..." style="padding-left: 36px;">
              <i class="bi bi-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-neutral);"></i>
            </div>
            <div style="width: 200px;">
              <select id="category-filter" class="form-select-custom">
                <option value="">All Categories</option>
                <option value="Microscopy">Microscopy</option>
                <option value="Spectrometry">Spectrometry</option>
                <option value="Thermal / Heat">Thermal / Heat</option>
                <option value="Centrifuges">Centrifuges</option>
                <option value="Measurement">Measurement</option>
                <option value="Computing">Computing</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Inventory Table -->
        <div class="card-custom" style="padding: 0; overflow: hidden;">
          <div style="padding: 16px 20px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center;">
            <h2 class="card-title" style="margin: 0;">Laboratory Assets <span id="equipment-count" style="font-size: 13px; font-weight: 500; color: var(--color-neutral);"></span></h2>
          </div>

          <div style="overflow-x: auto;">
            <table class="table-custom">
              <thead>
                <tr>
                  <th>Equipment & Serial</th>
                  <th>Category</th>
                  <th>Location</th>
                  <th>Est. Usage</th>
                  <th>Health (EHI)</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="equipment-table-body">
                <!-- Populated dynamically via equipment.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Equipment Modal (Admin) -->
  <div id="add-equipment-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: white; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; box-shadow: var(--shadow-lg);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px; font-weight: 700; color: var(--color-text-dark); margin: 0;">Register New Equipment</h2>
        <button type="button" id="close-add-modal-btn" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-neutral);">&times;</button>
      </div>

      <form id="add-equipment-form">
        <div style="margin-bottom: 14px;">
          <label class="form-label-custom" for="add-name">Equipment Name <span style="color: var(--color-danger);">*</span></label>
          <input type="text" id="add-name" class="form-control-custom" placeholder="e.g. Olympus CX23 Biological Microscope" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div>
            <label class="form-label-custom" for="add-category">Category <span style="color: var(--color-danger);">*</span></label>
            <select id="add-category" class="form-select-custom">
              <option value="Microscopy">Microscopy</option>
              <option value="Spectrometry">Spectrometry</option>
              <option value="Thermal / Heat">Thermal / Heat</option>
              <option value="Centrifuges">Centrifuges</option>
              <option value="Measurement">Measurement</option>
              <option value="Computing">Computing</option>
            </select>
          </div>
          <div>
            <label class="form-label-custom" for="add-location">Location / Room <span style="color: var(--color-danger);">*</span></label>
            <input type="text" id="add-location" class="form-control-custom" placeholder="e.g. Lab 2, Bay 4" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
          <div>
            <label class="form-label-custom">Expected Lifespan <span style="color: var(--color-danger);">*</span></label>
            <div style="display: flex; gap: 8px;">
              <input type="number" id="add-lifespan-value" class="form-control-custom" placeholder="e.g. 5" min="1" step="0.5" value="5" required style="flex: 1.2;">
              <select id="add-lifespan-unit" class="form-select-custom" style="flex: 1.2;">
                <option value="Years" selected>Years</option>
                <option value="Months">Months</option>
              </select>
            </div>
            <div id="lifespan-hours-preview" style="font-size: 11px; color: var(--color-neutral); margin-top: 4px;">
              &approx; <strong>10,000</strong> operational hours
            </div>
          </div>
          <div>
            <label class="form-label-custom" for="add-purchase-date">Purchase Date</label>
            <input type="date" id="add-purchase-date" class="form-control-custom">
          </div>
        </div>

        <div style="background-color: var(--color-surface); padding: 10px 14px; border-radius: 8px; font-size: 12px; color: var(--color-neutral); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--color-border);">
          <i class="bi bi-magic" style="color: var(--color-primary); font-size: 14px;"></i>
          <span>Asset Serial Number &amp; QR Tag are automatically generated by the system.</span>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn-outline-custom" onclick="document.getElementById('add-equipment-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn-primary-custom">Save & Generate QR</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/equipment.js"></script>
  <script>
    if (auth.requireAuth()) {
      renderSidebar('equipment');
      loadEquipment();
      setupEquipmentSearch();
    }
  </script>
</body>
</html>
